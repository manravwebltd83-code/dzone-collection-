        .admin-page-root {
          min-height: 100vh;
          background-color: #F4F1EA;
          color: var(--text-primary);
          display: flex;
          flex-direction: column;
          font-family: var(--font-body);
        }

        .admin-page-header {
          background-color: var(--text-primary);
          color: #FFFFFF;
          padding: 1rem 2rem;
          display: flex;
          align-items: center;
          justify-content: space-between;
          border-bottom: 2px solid var(--accent-gold);
          flex-wrap: wrap;
          gap: 1rem;
        }

        .admin-header-brand {
          display: flex;
          align-items: center;
          gap: 0.85rem;
        }

        .admin-brand-logo-img {
          height: 44px;
          width: auto;
          object-fit: contain;
          border-radius: var(--radius-sm);
        }

        .admin-header-brand h1 {
          font-family: var(--font-heading);
          font-size: 1.45rem;
          color: #FFFFFF;
          font-weight: 700;
          line-height: 1.1;
        }

        .admin-header-sub {
          font-size: 0.7rem;
          letter-spacing: 0.15em;
          color: var(--accent-gold);
          font-weight: 600;
        }

        .admin-header-actions {
          display: flex;
          align-items: center;
          gap: 0.65rem;
          flex-wrap: wrap;
        }

        .admin-btn-action {
          display: flex;
          align-items: center;
          gap: 0.35rem;
          padding: 0.5rem 0.85rem;
          background: rgba(255, 255, 255, 0.1);
          border: 1px solid rgba(255, 255, 255, 0.2);
          color: #E2DDD5;
          border-radius: var(--radius-sm);
          font-size: 0.775rem;
          font-weight: 600;
          cursor: pointer;
          transition: var(--transition-smooth);
        }

        .admin-btn-action:hover {
          background-color: rgba(255, 255, 255, 0.2);
          color: #FFF;
        }

        .admin-btn-action.danger {
          background-color: rgba(239, 68, 68, 0.2);
          border-color: rgba(239, 68, 68, 0.4);
          color: #FCA5A5;
        }
        .admin-btn-action.danger:hover {
          background-color: #EF4444;
          color: #FFF;
        }

        .admin-btn-viewsite {
          display: flex;
          align-items: center;
          gap: 0.4rem;
          padding: 0.5rem 1rem;
          background-color: var(--accent-gold);
          color: var(--text-primary);
          font-weight: 700;
          font-size: 0.785rem;
          border-radius: var(--radius-sm);
          transition: var(--transition-smooth);
        }
        .admin-btn-viewsite:hover {
          background-color: #FFFFFF;
        }

        .admin-page-layout {
          display: grid;
          grid-template-columns: 260px 1fr;
          flex-grow: 1;
        }
        @media (max-width: 900px) {
          .admin-page-layout {
            grid-template-columns: 1fr;
          }
        }

        .admin-sidebar {
          background-color: #FFFFFF;
          border-right: 1px solid var(--border-color);
          padding: 1.5rem 1rem;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
        }

        .sidebar-nav {
          display: flex;
          flex-direction: column;
          gap: 0.4rem;
        }

        .sidebar-nav-item {
          display: flex;
          align-items: center;
          gap: 0.75rem;
          padding: 0.85rem 1rem;
          border-radius: var(--radius-sm);
          font-size: 0.875rem;
          font-weight: 600;
          color: var(--text-secondary);
          text-align: left;
          transition: var(--transition-smooth);
        }

        .sidebar-nav-item:hover {
          background-color: var(--bg-main);
          color: var(--text-primary);
        }

        .sidebar-nav-item.active {
          background-color: var(--text-primary);
          color: #FFFFFF;
          font-weight: 700;
        }

        .sidebar-footer-card {
          background-color: var(--bg-main);
          padding: 1rem;
          border-radius: var(--radius-sm);
          border: 1px solid var(--border-color);
          margin-top: 2rem;
        }
        .card-store-name {
          font-family: var(--font-heading);
          font-weight: 700;
          font-size: 1.05rem;
        }
        .sidebar-footer-card p {
          font-size: 0.75rem;
          color: var(--text-secondary);
          margin-bottom: 0.85rem;
        }
        .sidebar-logout-btn {
          display: flex;
          align-items: center;
          gap: 0.35rem;
          font-size: 0.75rem;
          font-weight: 700;
          color: #C62828;
          width: 100%;
        }

        .admin-main-content {
          padding: 2rem;
          overflow-y: auto;
        }

        .admin-card-panel {
          background-color: #FFFFFF;
          border-radius: var(--radius-md);
          border: 1px solid var(--border-color);
          padding: 2rem;
          box-shadow: var(--shadow-sm);
        }

        .panel-header-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 1.5rem;
          flex-wrap: wrap;
          gap: 1rem;
        }

        .panel-title {
          font-size: 1.65rem;
          font-weight: 700;
          color: var(--text-primary);
        }
        .panel-sub {
          font-size: 0.85rem;
          color: var(--text-secondary);
        }

        .orders-filter-bar {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 1rem;
          margin-bottom: 1.5rem;
          flex-wrap: wrap;
        }
        .order-status-pills {
          display: flex;
          gap: 0.4rem;
          flex-wrap: wrap;
        }
        .order-date-text {
          font-size: 0.725rem;
          color: var(--text-muted);
        }
        .contact-detail-line {
          font-size: 0.785rem;
          color: var(--text-secondary);
          display: flex;
          align-items: center;
          gap: 0.25rem;
          margin-top: 2px;
        }
        .address-box-cell {
          font-size: 0.825rem;
          color: var(--text-secondary);
          line-height: 1.35;
        }
        .status-dropdown {
          padding: 0.35rem 0.6rem;
          border-radius: var(--radius-sm);
          font-size: 0.775rem;
          font-weight: 700;
          outline: none;
          border: 1px solid var(--border-color);
        }
        .status-new-lead { background-color: #FFEBEE; color: #C62828; }
        .status-confirmed { background-color: #FFF8E1; color: #F57F17; }
        .status-shipped { background-color: #E3F2FD; color: #1565C0; }
        .status-delivered { background-color: #E8F5E9; color: #2E7D32; }
        .status-cancelled { background-color: #ECEFF1; color: #37474F; }

        .wa-btn {
          color: #25D366 !important;
          border-color: #25D366 !important;
          text-decoration: none;
        }
        .wa-btn:hover {
          background-color: #25D366 !important;
          color: #FFF !important;
        }

        .cat-selector-bar {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          flex-wrap: wrap;
          margin-bottom: 1rem;
        }
        .cat-label {
          font-size: 0.85rem;
          font-weight: 700;
        }
        .cat-pill {
          padding: 0.45rem 1rem;
          border-radius: var(--radius-full);
          font-size: 0.8rem;
          font-weight: 600;
          background-color: var(--bg-main);
          border: 1px solid var(--border-color);
          color: var(--text-secondary);
        }
        .cat-pill.active {
          background-color: var(--text-primary);
          color: #FFFFFF;
          border-color: var(--text-primary);
        }

        .subcat-admin-bar {
          display: flex;
          align-items: center;
          gap: 0.4rem;
          flex-wrap: wrap;
          margin-bottom: 1.5rem;
          padding: 0.75rem 1rem;
          background-color: var(--bg-main);
          border-radius: var(--radius-sm);
          border: 1px solid var(--border-color);
        }
        .subcat-admin-label {
          font-size: 0.775rem;
          font-weight: 700;
          color: var(--text-secondary);
          display: flex;
          align-items: center;
          gap: 0.3rem;
          text-transform: uppercase;
        }
        .subcat-admin-chip {
          padding: 0.35rem 0.85rem;
          border-radius: var(--radius-full);
          font-size: 0.75rem;
          font-weight: 600;
          background-color: #FFFFFF;
          border: 1px solid var(--border-color);
          color: var(--text-secondary);
        }
        .subcat-admin-chip.active {
          background-color: var(--accent-gold-light);
          border-color: var(--accent-gold);
          color: var(--accent-gold-dark);
          font-weight: 700;
        }

        .admin-table-container {
          overflow-x: auto;
        }

        .admin-full-table {
          width: 100%;
          border-collapse: collapse;
          font-size: 0.9rem;
        }
        .admin-full-table th {
          text-align: left;
          padding: 0.85rem 1rem;
          background-color: var(--bg-main);
          color: var(--text-primary);
          font-weight: 700;
          border-bottom: 1px solid var(--border-color);
          font-size: 0.75rem;
          text-transform: uppercase;
        }
        .admin-full-table td {
          padding: 1rem;
          border-bottom: 1px solid var(--border-light);
          vertical-align: middle;
        }
        .table-product-thumb {
          width: 52px;
          height: 52px;
          object-fit: cover;
          border-radius: var(--radius-sm);
          border: 1px solid var(--border-color);
        }
        .table-product-title {
          font-size: 0.95rem;
          color: var(--text-primary);
        }
        .table-product-desc {
          font-size: 0.775rem;
          color: var(--text-secondary);
        }
        .table-price-cell {
          font-family: var(--font-heading);
          font-size: 1.1rem;
          font-weight: 700;
        }

        .row-action-btns {
          display: flex;
          gap: 0.5rem;
        }
        .action-icon {
          display: inline-flex;
          align-items: center;
          gap: 0.3rem;
          padding: 0.4rem 0.75rem;
          border-radius: var(--radius-sm);
          font-size: 0.75rem;
          font-weight: 600;
          border: 1px solid var(--border-color);
          background-color: #FFFFFF;
        }
        .action-icon.edit:hover { background-color: var(--accent-gold-light); color: var(--accent-gold-dark); }
        .action-icon.delete:hover { background-color: #FFEBEE; color: #C62828; border-color: #FFCDD2; }

        .empty-table-cell {
          text-align: center;
          padding: 3rem;
          color: var(--text-secondary);
        }

        .admin-full-form {
          max-width: 800px;
        }
        .form-header-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 1.5rem;
          padding-bottom: 0.85rem;
          border-bottom: 1px solid var(--border-light);
        }
        .form-layout-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 1.25rem;
        }
        .form-group {
          display: flex;
          flex-direction: column;
          gap: 0.4rem;
        }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { font-size: 0.8rem; font-weight: 700; }
        .form-group input, .form-group select, .form-group textarea {
          padding: 0.75rem 1rem;
          border-radius: var(--radius-sm);
          border: 1px solid var(--border-color);
          font-size: 0.9rem;
          font-family: var(--font-body);
          outline: none;
        }

        .device-upload-container {
          border: 1px dashed var(--accent-gold);
          border-radius: var(--radius-sm);
          padding: 1.5rem;
          background-color: var(--bg-main);
          display: flex;
          flex-direction: column;
          gap: 1rem;
        }
        .drag-drop-dropzone {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 0.65rem;
          padding: 1.5rem;
          background-color: #FFFFFF;
          border-radius: var(--radius-sm);
          border: 2px dashed var(--border-color);
          text-align: center;
        }
        .image-url-row {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          font-size: 0.85rem;
        }
        .image-url-row input { flex-grow: 1; }
        .preview-image-box {
          display: flex;
          align-items: center;
          gap: 1rem;
          padding: 0.65rem;
          background: #FFFFFF;
          border-radius: var(--radius-sm);
          border: 1px solid var(--border-color);
        }
        .preview-image-box img {
          width: 56px;
          height: 56px;
          object-fit: cover;
          border-radius: 4px;
        }

        .form-submit-row {
          display: flex;
          justify-content: flex-end;
          gap: 1rem;
          margin-top: 2rem;
        }

        .homepage-photos-grid {
          display: grid;
          grid-template-columns: repeat(1, 1fr);
          gap: 1.5rem;
          margin-top: 1.5rem;
        }
        @media (min-width: 600px) {
          .homepage-photos-grid {
            grid-template-columns: repeat(2, 1fr);
          }
        }
        @media (min-width: 1050px) {
          .homepage-photos-grid {
            grid-template-columns: repeat(3, 1fr);
          }
        }

        .homepage-photo-card {
          background-color: var(--bg-main);
          border-radius: var(--radius-sm);
          border: 1px solid var(--border-color);
          padding: 1.25rem;
          display: flex;
          flex-direction: column;
          gap: 0.85rem;
        }
        .homepage-photo-card h4 {
          font-size: 0.9rem;
          font-weight: 700;
        }
        .photo-preview {
          height: 160px;
          border-radius: var(--radius-sm);
          overflow: hidden;
          border: 1px solid var(--border-color);
        }
        .photo-preview img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        .full-w { width: 100%; text-align: center; justify-content: center; }

        .reviews-table-wrap {
          display: flex;
          flex-direction: column;
          gap: 1rem;
          margin-top: 1rem;
        }
        .admin-review-card {
          background-color: var(--bg-main);
          padding: 1.25rem;
          border-radius: var(--radius-sm);
          border: 1px solid var(--border-color);
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 1rem;
        }
        .rev-header { font-size: 0.95rem; margin-bottom: 0.25rem; }
        .rev-stars { color: #FFB800; margin-left: 0.5rem; }
